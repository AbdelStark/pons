name: Dependency Updates

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    # Allow manual triggering

permissions:
  contents: write
  pull-requests: write

jobs:
  update-rust-dependencies:
    name: Update Rust Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-update
        run: cargo install cargo-update

      - name: Update Cargo.lock
        run: |
          cd pons_cli
          cargo update
          
      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet pons_cli/Cargo.lock; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Rust dependencies"
          title: "🔄 Update Rust Dependencies"
          body: |
            Automated dependency update for Rust packages in `pons_cli`.
            
            ## Changes
            - Updated `Cargo.lock` with latest compatible versions
            
            ## Testing
            - [ ] CI tests pass
            - [ ] E2E tests pass
            - [ ] Manual smoke test
            
            **Auto-generated by GitHub Actions**
          branch: "deps/rust-updates"
          delete-branch: true

  update-cairo-dependencies:
    name: Update Cairo Dependencies  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1.3.2
        with:
          scarb-version: "nightly"

      - name: Update Scarb.lock
        run: |
          cd pons_stark
          scarb update

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet pons_stark/Scarb.lock; then
            echo "changes=false" >> $GITHUB_OUTPUT
          else
            echo "changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update Cairo dependencies"
          title: "🐪 Update Cairo Dependencies"
          body: |
            Automated dependency update for Cairo packages in `pons_stark`.
            
            ## Changes
            - Updated `Scarb.lock` with latest compatible versions
            
            ## Testing
            - [ ] CI tests pass
            - [ ] E2E tests pass
            - [ ] Manual smoke test
            
            **Auto-generated by GitHub Actions**
          branch: "deps/cairo-updates"
          delete-branch: true

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --features=fix

      - name: Run security audit
        run: |
          cd pons_cli
          cargo audit

      - name: Python security check
        run: |
          python3.10 -m pip install safety
          python3.10 -m safety check --json

  dependency-summary:
    name: Dependency Summary
    runs-on: ubuntu-latest
    needs: [update-rust-dependencies, update-cairo-dependencies, security-audit]
    if: always()
    steps:
      - name: Summary Report
        run: |
          echo "## 📦 Dependency Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Status | Notes |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Rust Dependencies | ${{ needs.update-rust-dependencies.result }} | pons_cli Cargo.lock |" >> $GITHUB_STEP_SUMMARY
          echo "| Cairo Dependencies | ${{ needs.update-cairo-dependencies.result }} | pons_stark Scarb.lock |" >> $GITHUB_STEP_SUMMARY
          echo "| Security Audit | ${{ needs.security-audit.result }} | Vulnerability scan |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Generated**: $(date -u)" >> $GITHUB_STEP_SUMMARY