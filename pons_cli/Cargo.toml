[package]
name = "pons_cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for generating STARK proofs of Bitcoin signature validity"
authors = ["PONS Team"]
license = "MIT"

[[bin]]
name = "pons-cli"
path = "src/main.rs"

[dependencies]
# Bitcoin and cryptography
bitcoin = "0.32"
secp256k1 = { version = "0.29", features = ["rand-std", "global-context"] }

# CLI and argument parsing
clap = { version = "4.0", features = ["derive"] }

# Async runtime
tokio = { version = "1.0", features =["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling and utilities
anyhow = "1.0"
hex = "0.4"
sha2 = "0.10"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
tempfile = "3.0"